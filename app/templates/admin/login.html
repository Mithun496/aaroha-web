<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AAROHA Admin Login</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>


<body class="auth-page">

<main class="admin-login-page">

    <div class="admin-login-card">


        <div class="admin-brand">

            <img
                src="{{ url_for('static', filename='images/logo/aaroha-logo.png') }}"
                alt="AAROHA"
            >

        </div>


        <div class="admin-login-heading">

            <span>
                AAROHA ADMIN
            </span>

            <h1>
                Welcome back.
            </h1>

            <p>
                Sign in to manage partner applications
                and verification.
            </p>

        </div>


        {% if error %}

            <div class="form-error">
                {{ error }}
            </div>

        {% endif %}


        <form
            method="POST"
            class="admin-login-form"
        >
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="form-group">

                <label for="email">
                    Administrator Email
                </label>

                <input
                    id="email"
                    name="email"
                    type="email"
                    class="form-input"
                    autocomplete="username"
                    placeholder="admin@aaroha.in"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    id="password"
                    name="password"
                    type="password"
                    class="form-input"
                    autocomplete="current-password"
                    placeholder="Enter administrator password"
                    required
                >

            </div>


            <button
                type="submit"
                class="primary-button"
            >

                Sign In

                <span>
                    →
                </span>

            </button>

        </form>


        <p class="admin-security-note">
            Restricted administrator access.
        </p>

    </div>

</main>

</body>
</html>
