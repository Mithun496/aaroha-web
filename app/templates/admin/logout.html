{% extends "base.html" %}

{% block title %}Admin logout | AAROHA{% endblock %}

{% block content %}
<section class="page-shell narrow">
  <div class="page-hero compact">
    <span>Administrator</span>
    <h1>Log out?</h1>
    <p>End the current administrator session.</p>
  </div>
  <form method="post" action="{{ url_for('admin.logout') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <button type="submit" class="primary-btn">Log out</button>
    <a class="secondary-btn" href="{{ url_for('admin.dashboard') }}">Cancel</a>
  </form>
</section>
{% endblock %}
