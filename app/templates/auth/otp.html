<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Verify OTP | AAROHA</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/premium.css') }}">

</head>

<body>

<div class="auth-page">

    <div class="auth-container">

        <a href="{{ url_for('auth.phone') }}"
           class="back-button">
            ←
        </a>

        <div class="auth-heading">

            <span class="eyebrow">
                VERIFICATION
            </span>

            <h1>
                Verify OTP
            </h1>

            <p>
                Enter the 6-digit code sent to
                <strong>+91 {{ phone }}</strong>
            </p>

        </div>

        {% if error %}
            <div class="form-error">
                {{ error }}
            </div>
        {% endif %}

        <form method="POST">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <label class="otp-label">6-digit verification code</label>
            <div class="otp-container" role="group" aria-label="Six digit verification code">

                <input maxlength="1" name="otp1" inputmode="numeric" aria-label="Digit 1">
                <input maxlength="1" name="otp2" inputmode="numeric" aria-label="Digit 2">
                <input maxlength="1" name="otp3" inputmode="numeric" aria-label="Digit 3">
                <input maxlength="1" name="otp4" inputmode="numeric" aria-label="Digit 4">
                <input maxlength="1" name="otp5" inputmode="numeric" aria-label="Digit 5">
                <input maxlength="1" name="otp6" inputmode="numeric" aria-label="Digit 6">

            </div>

            <!-- Development helper -->
                <input
                    type="hidden"
                    id="otp"
                name="otp" autocomplete="one-time-code">

            <button
                type="submit"
                class="primary-button">

                Verify & Continue
                <span>→</span>

            </button>

        </form>

        <div class="resend">

            <span>
                Didn't receive the code?
            </span>

            <a href="{{ url_for('auth.phone') }}">Request a new code</a>

        </div>

        <div class="development-note">
            {% if config.ENVIRONMENT != "production" %}Development OTP is printed in the Flask terminal when OTP_PROVIDER=console.{% endif %}
        </div>

    </div>

</div>

<script>

const boxes = document.querySelectorAll(
    ".otp-container input"
);

const hiddenOtp = document.getElementById("otp");

boxes.forEach((box, index) => {

    box.addEventListener("input", () => {

        box.value = box.value.replace(/\D/g, "");

        if (box.value && index < boxes.length - 1) {
            boxes[index + 1].focus();
        }

        hiddenOtp.value =
            Array.from(boxes)
                .map(input => input.value)
                .join("");

    });

    box.addEventListener("keydown", (event) => {

        if (
            event.key === "Backspace" &&
            !box.value &&
            index > 0
        ) {
            boxes[index - 1].focus();
        }

    });

});

</script>

</body>
</html>
