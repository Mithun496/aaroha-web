<!doctype html><html><head><meta charset="utf-8"><title>Auto | AAROHA</title></head><body><main><h1>Request an auto</h1>{% if error %}<p>{{ error }}</p>{% endif %}<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Pickup <input name="pickup" required></label><label>Destination <input name="destination" required></label><label>Captain <select name="captain_id" required>{% for captain in captains %}<option value="{{ captain.id }}">{{ captain.full_name }} · {{ captain.vehicle_number or 'Auto' }}</option>{% else %}<option disabled>No approved captains online</option>{% endfor %}</select></label><button type="submit">Request auto</button></form></main></body></html>
