<!doctype html><html><head><meta charset="utf-8"><title>Emergency contacts | AAROHA</title></head><body><main><h1>Trusted emergency contacts</h1>{% if error %}<p>{{ error }}</p>{% endif %}<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input name="name" placeholder="Name" required><input name="phone" placeholder="Phone" required><input name="relationship" placeholder="Relationship"><label><input type="checkbox" name="is_primary"> Primary contact</label><button type="submit">Add contact</button></form>{% for contact in contacts %}<article><strong>{{ contact.name }}</strong><p>{{ contact.phone }}{% if contact.relationship %} · {{ contact.relationship }}{% endif %}</p><form method="post" action="{{ url_for('marketplace.delete_emergency_contact', contact_id=contact.id) }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button type="submit">Delete</button></form></article>{% else %}<p>No trusted contacts yet.</p>{% endfor %}</main></body></html>
