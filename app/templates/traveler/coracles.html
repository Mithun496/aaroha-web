<!doctype html><html><head><meta charset="utf-8"><title>Coracles | AAROHA</title></head><body><main><h1>Book a coracle</h1>{% if error %}<p>{{ error }}</p>{% endif %}<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Operator <select name="operator_id" required>{% for operator in operators %}<option value="{{ operator.id }}">{{ operator.business_name }} · {{ operator.price }} INR per passenger</option>{% else %}<option disabled>No approved operators</option>{% endfor %}</select></label><label>Date <input type="date" name="booking_date" required></label><label>Time <input name="booking_time" required></label><label>Passengers <input type="number" name="passengers" min="1" required></label><button type="submit">Request coracle</button></form></main></body></html>
