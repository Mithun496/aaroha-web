<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Edit Pricing | AAROHA</title><link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"></head><body class="partner-dashboard-page"><main class="partner-profile-edit-page"><div class="profile-edit-container"><a class="profile-edit-back" href="{{ url_for('partner.dashboard') }}">← Back to Dashboard</a><div class="profile-edit-heading"><span>GUIDE PRICING</span><h1>Manage your rates.</h1><p>Set the general prices travelers see before they request a booking.</p></div>{% if error %}<div class="form-error">{{ error }}</div>{% endif %}<form method="POST" class="profile-edit-form">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><section class="profile-edit-card"><div class="profile-edit-section-heading"><span>01</span><div><h2>Pricing model</h2><p>Choose whether the rate is per person or per group.</p></div></div><div class="form-group"><label for="pricing_type">Pricing type</label><select class="form-input" id="pricing_type" name="pricing_type" required><option value="">Select</option><option value="per_person" {% if application.pricing_type=='per_person' %}selected{% endif %}>Per person</option><option value="per_group" {% if application.pricing_type=='per_group' %}selected{% endif %}>Per group</option></select></div><div class="profile-edit-grid"><div class="form-group"><label>Hourly rate (₹)</label><input class="form-input" type="number" step="0.01" min="0" name="hourly_rate" value="{{ application.hourly_rate or 0 }}" required></div><div class="form-group"><label>Half-day rate (₹)</label><input class="form-input" type="number" step="0.01" min="0" name="half_day_rate" value="{{ application.half_day_rate or 0 }}" required></div><div class="form-group"><label>Full-day rate (₹)</label><input class="form-input" type="number" step="0.01" min="0" name="full_day_rate" value="{{ application.full_day_rate or 0 }}" required></div><div class="form-group"><label>Maximum pricing group size</label><input class="form-input" type="number" min="1" name="pricing_group_size" value="{{ application.pricing_group_size or application.max_group_size or 1 }}" required></div><div class="form-group"><label>Minimum booking notice (hours)</label><input class="form-input" type="number" min="0" name="minimum_booking_notice" value="{{ application.minimum_booking_notice or 0 }}" required></div></div></section><div class="profile-edit-actions"><a href="{{ url_for('partner.dashboard') }}" class="dashboard-secondary-button profile-cancel-button">Cancel</a><button class="primary-button profile-save-button" type="submit">Save Pricing <span>→</span></button></div></form></div></main></body></html>
