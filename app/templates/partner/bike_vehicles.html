{% extends "base.html" %}

{% block title %}Add vehicle{% endblock %}

{% block content %}
<section class="page-shell narrow">
  <div class="page-hero compact">
    <span>Fleet</span>
    <h1>Add a vehicle</h1>
  </div>

  <form method="post" class="auth-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-row two-col">
      <div>
        <label>Vehicle name</label>
        <input type="text" name="name" required>
      </div>
      <div>
        <label>Type</label>
        <input type="text" name="vehicle_type" placeholder="Scooter, bike, etc." required>
      </div>
    </div>
    <div class="form-row two-col">
      <div>
        <label>Registration</label>
        <input type="text" name="registration_number">
      </div>
      <div>
        <label>Daily price</label>
        <input type="number" name="price" min="0" step="0.01" value="900" required>
      </div>
    </div>
    <div class="form-row two-col">
      <div>
        <label>Pickup location</label>
        <input type="text" name="location" required>
      </div>
      <div>
        <label>Pricing unit</label>
        <select name="pricing_unit">
          <option value="day">Per day</option>
          <option value="hour">Per hour</option>
        </select>
      </div>
    </div>
    <button type="submit" class="primary-btn">Add vehicle</button>
  </form>
</section>
{% endblock %}
