services:
  - type: web
    name: aaroha-web
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    preDeployCommand: python -m flask --app app db upgrade
    startCommand: gunicorn -c gunicorn.conf.py wsgi:app
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: TRUSTED_HOSTS
        value: aaroha-web.onrender.com
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: aaroha-db
          property: connectionString
      - key: RATELIMIT_STORAGE_URI
        sync: false
      - key: OTP_PROVIDER
        value: twilio
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_VERIFY_SERVICE_SID
        sync: false
      - key: PAYMENT_PROVIDER
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: STORAGE_PROVIDER
        value: s3
      - key: STORAGE_ENDPOINT
        sync: false
      - key: STORAGE_BUCKET
        sync: false
      - key: STORAGE_ACCESS_KEY
        sync: false
      - key: STORAGE_SECRET_KEY
        sync: false
      - key: STORAGE_REGION
        sync: false
      - key: STORAGE_PUBLIC_BASE_URL
        sync: false
      - key: UPLOAD_DIR
        value: /tmp/aaroha/uploads

databases:
  - name: aaroha-db
    plan: free
    region: singapore
